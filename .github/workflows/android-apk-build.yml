name: Build Android Debug APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - chore/apk-wrap
    paths:
      - "android/**"
      - "capacitor.config.json"
      - ".github/workflows/android-apk-build.yml"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install root & web dependencies
        run: npm ci && npm --prefix apps/web ci

      - name: Build web bundle & sync Capacitor
        run: npm --prefix apps/web run build && npx cap sync android

      - name: Restore google-services.json from GitHub Secret
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: froyek-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

