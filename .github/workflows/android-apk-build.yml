name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/android-apk-build.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Buat GitHub Release secara eksplisit"
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web assets (Vite)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set +x
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      - name: Sync Capacitor web assets to Android
        run: npx cap sync android

      - name: Build Android APK (debug)
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: froyek-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Get version from package.json
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || github.event.inputs.create_release == 'true')
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || github.event.inputs.create_release == 'true')
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: froyek-mobile-v${{ steps.version.outputs.version }}
          release_name: Froyek Mobile v${{ steps.version.outputs.version }}
          body: |
            Froyek Mobile Android APK (debug)

            Build from commit ${{ github.sha }}
            Web app: https://froyek.com/app
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release URL
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || github.event.inputs.create_release == 'true')
        run: echo "Release: ${{ steps.release.outputs.upload_url }}"
