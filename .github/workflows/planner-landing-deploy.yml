name: Deploy Planner Landing

on:
  push:
    branches: [main]
    paths:
      - "Planner-Landing-Page/**"
      - ".github/workflows/planner-landing-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Planner-Landing-Page
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Planner-Landing-Page/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          ADMIN_PASSWORD: ci-build-only
          NEXT_PUBLIC_BASE_PATH: /lp2
          PLANNER_APP_ORIGIN: https://monefyi-planner.vercel.app
          NEXT_PUBLIC_PLANNER_APP_URL: https://planner.monefyi.com
          PLANNER_LANDING_ORIGIN: https://planner-landing.vercel.app

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLANNER_LANDING_PROJECT_ID }}
