name: Agent eval gate

on:
  pull_request:
  push:
    paths:
      - "agent-core/**"
      - "evals/**"
      - "packages/domain/**"
      - "apps/web/src/lib/agentEval.test.ts"
      - "apps/web/src/lib/financeAgentEval.test.ts"
      - "apps/web/src/lib/financeEntryEngine.test.ts"
      - ".github/workflows/agent-eval.yml"

jobs:
  rendah:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Docs gate
        working-directory: .
        run: node scripts/docs-gate-check.mjs
      - name: Gerbang tier rendah
        run: npx vitest run src/lib/agentEval.test.ts src/lib/agentRuntime.test.ts src/lib/agentTools.test.ts src/lib/financeEntryEngine.test.ts src/lib/financeAgentEval.test.ts
