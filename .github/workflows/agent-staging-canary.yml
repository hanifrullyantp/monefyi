name: Agent Staging & Canary Deploy

on:
  push:
    branches: [main]
    paths:
      - "agent-core/**"
      - "evals/**"
      - "packages/domain/**"
      - "my-supabase-project/supabase/functions/planner-agent-run/**"
      - "my-supabase-project/supabase/functions/planner-agent-health/**"
      - "my-supabase-project/supabase/functions/planner-agent-monitoring/**"
      - "my-supabase-project/supabase/functions/_shared/agent/**"
      - "my-supabase-project/supabase/functions/_shared/monitoring.ts"
      - ".github/workflows/agent-staging-canary.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent-core/**"
      - "evals/**"
      - "packages/domain/**"
      - "my-supabase-project/supabase/functions/planner-agent-run/**"
      - "my-supabase-project/supabase/functions/planner-agent-health/**"
      - "my-supabase-project/supabase/functions/planner-agent-monitoring/**"
      - "my-supabase-project/supabase/functions/_shared/agent/**"
      - "my-supabase-project/supabase/functions/_shared/monitoring.ts"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run agent eval gate
        run: npx vitest run src/lib/agentEval.test.ts src/lib/agentRuntime.test.ts src/lib/agentTools.test.ts src/lib/financeEntryEngine.test.ts src/lib/financeAgentEval.test.ts src/lib/rapLearningEval.test.ts
        working-directory: apps/web

  staging-deploy:
    needs: eval
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-supabase-project
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/cli@v1
        with:
          version: latest
      - name: Link Supabase STAGING project
        run: supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push agent migrations to STAGING
        run: supabase db push --remote --yes --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy agent edge functions to STAGING
        run: |
          supabase functions deploy planner-agent-run
          supabase functions deploy planner-agent-health
          supabase functions deploy planner-agent-monitoring
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Run health check against STAGING
        run: |
          curl -sf https://api.supabase.co/functions/v1/planner-agent-health \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.exit(j.status==='healthy'||j.status==='degraded'?0:1)})"
        env:
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      - name: Run monitoring smoke test against STAGING
        run: |
          curl -sf https://api.supabase.co/functions/v1/planner-agent-monitoring \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.exit(j.status===200?0:1)})"
        env:
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}

  production-promote:
    needs: staging-deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-supabase-project
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/cli@v1
        with:
          version: latest
      - name: Link Supabase PRODUCTION project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push agent migrations to PRODUCTION
        run: supabase db push --remote --yes --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy agent edge functions to PRODUCTION
        run: |
          supabase functions deploy planner-agent-run
          supabase functions deploy planner-agent-health
          supabase functions deploy planner-agent-monitoring
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Run health check against PRODUCTION
        run: |
          curl -sf https://api.supabase.co/functions/v1/planner-agent-health \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.exit(j.status==='healthy'||j.status==='degraded'?0:1)})"
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
