# Otomatis deploy webhook Lynk + auth email saat kode backend berubah (push main).
# Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
# Opsional: LYNK_MERCHANT_KEY (untuk verify E2E di CI)

name: Supabase Lynk auto-deploy

on:
  push:
    branches: [main]
    paths:
      - "my-supabase-project/supabase/functions/**"
      - "scripts/verify-product-funnel.sh"
      - "scripts/lynk-compute-signature.mjs"
      - ".github/workflows/supabase-lynk-auto-deploy.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: my-supabase-project

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy Lynk + purchase handlers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in lynk-webhook planner-lynk-webhook auth-send-email planner-create-owner-org; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --no-verify-jwt
          done

      - name: Verify product funnel (URLs + webhooks + optional Lynk E2E)
        env:
          LYNK_MERCHANT_KEY: ${{ secrets.LYNK_MERCHANT_KEY }}
        run: |
          cd ..
          chmod +x ./scripts/verify-product-funnel.sh
          ./scripts/verify-product-funnel.sh
